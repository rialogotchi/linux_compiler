name: build-atum-image

# Elle calistir: Actions > build-atum-image > Run workflow
on:
  workflow_dispatch:
    inputs:
      alpine_version:
        description: "Alpine surumu (musl + busybox kaynagi), ornek 3.22"
        type: string
        default: "3.22"
      image_size_mb:
        description: "Disk imaji boyutu (MB)"
        type: string
        default: "3072"
      hostname:
        description: "Makine adi"
        type: string
        default: "atum"
      firmware:
        description: "Ag karti / wifi firmware paketleri"
        type: choice
        options: [common, none, all]
        default: common
      wifi:
        description: "wifi destegi (wpa_supplicant, iw, wifi-connect)"
        type: boolean
        default: true
      autologin:
        description: "Konsolda parolasiz root girisi (SSH zaten yok)"
        type: boolean
        default: true
      root_password:
        description: "root parolasi (autologin kapaliysa kullanilir)"
        type: string
        default: "atum"
      extra_packages:
        description: "Ek Alpine paketleri (bosluklu), ornek: nano htop"
        type: string
        default: ""
      smoke_test:
        description: "QEMU ile acilis + internet testi calistir"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Host araclari
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xorriso mtools grub-common grub-pc-bin grub-efi-amd64-bin \
            dosfstools e2fsprogs gdisk parted cpio xz-utils qemu-system-x86

      - name: "rootfs (Alpine konteyneri - musl + busybox + atum)"
        env:
          ALPINE_VERSION: ${{ inputs.alpine_version }}
          HOSTNAME_: ${{ inputs.hostname }}
          FIRMWARE: ${{ inputs.firmware }}
          WIFI: ${{ inputs.wifi }}
          AUTOLOGIN: ${{ inputs.autologin }}
          ROOT_PASSWORD: ${{ inputs.root_password }}
          EXTRA_PACKAGES: ${{ inputs.extra_packages }}
        run: |
          docker run --rm -v "$PWD":/work \
            -e ALPINE_VERSION -e HOSTNAME_ -e FIRMWARE -e WIFI \
            -e AUTOLOGIN -e ROOT_PASSWORD -e EXTRA_PACKAGES \
            "alpine:${ALPINE_VERSION}" sh /work/image/build-rootfs.sh

      - name: ISO + disk imaji
        env:
          IMAGE_SIZE_MB: ${{ inputs.image_size_mb }}
        run: sudo -E bash image/make-images.sh

      - name: Acilis + internet testi (QEMU, ISO ve IMG)
        if: ${{ inputs.smoke_test }}
        continue-on-error: true
        run: |
          ACCEL="-accel tcg"
          if [ -w /dev/kvm ]; then ACCEL="-accel kvm"; fi
          run_vm() { # ad  qemu-disk-argumanlari...
            name=$1; shift
            : > "$name.log"
            qemu-system-x86_64 $ACCEL -m 2048 -smp 2 -display none \
              -serial "file:$name.log" -nic user,model=virtio-net-pci "$@" &
            pid=$!
            ok=1
            for _ in $(seq 1 90); do
              if grep -q "ATUM-NET-OK" "$name.log"; then ok=0; break; fi
              kill -0 $pid 2>/dev/null || break
              sleep 4
            done
            kill $pid 2>/dev/null || true
            echo "---- $name ($([ $ok = 0 ] && echo BASARILI || echo BASARISIZ)) ----"
            grep -a "atum-netcheck" "$name.log" || tail -n 40 "$name.log"
            return $ok
          }
          rc=0
          run_vm iso -cdrom out/atum.iso -boot d || rc=1
          run_vm img -drive file=out/atum-disk.img,format=raw,if=virtio || rc=1
          exit $rc

      - name: Paketle
        if: ${{ always() }}
        run: |
          mkdir -p dist
          [ -f out/atum.iso ] && cp out/atum.iso dist/
          [ -f out/atum-disk.img ] && xz -T0 -6 -c out/atum-disk.img > dist/atum-disk.img.xz
          cp -f iso.log img.log dist/ 2>/dev/null || true
          cd dist && { [ -n "$(ls -A)" ] && sha256sum * > SHA256SUMS; ls -lh; }

      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: atum-images
          path: dist/
          if-no-files-found: error
